# Default values for fridgefreak_chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

globals:
  labels:
    app: fridgefreak

postInstall:
  databaseSync: false

mysql:
  name: mysql-ss
  labels:
    type: database

  image:
    repository: registry.redhat.io/rhel8/mysql-80
    tag: "latest"

fridgefreak:
  name: fridgefreak
  port: 8000
  labels:
    type: backend

  image:
    repository: ghcr.io/dgrzelec/fridgefreak-app
    tag: "0.2-alpine"
    pullPolicy: "Always"

imagePullSecrets: 
  - mysql: 18129941-dgrzelec-redhat-vm-pull-secret
  - fridgefreak: regcred


configMaps:
  backend: "config-backend"

secrets:
  backend: "secret-backend"